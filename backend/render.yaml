services:
  - type: web
    name: maha-eseva-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        value: anugadesanika@gmail.com
      - key: EMAIL_PASS
        sync: false
